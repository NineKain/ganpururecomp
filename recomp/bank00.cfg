# Gunmans Proof (JPN) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs

# Reset vector $d448, native NMI $01fc (from the cartridge header).

# >>> BEGIN symbols.toml (generated — do not edit)
symbol 0001fc I_NMI
force_lle 0001fc
func I_RESET d448 entry_mx:1,1
# <<< END symbols.toml

# RESET's copier/RAM-copy branch ends in JMP $8000 (never taken on a normal
# cartridge: needs $FFDC|$FFDE == 0 or a writable ROM). $D4A9 is a data byte
# used by that writability probe. Keep both out of decode.
exclude_range d4a6 d4ab
